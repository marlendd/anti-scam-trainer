version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  go: "1.25"

linters:
  # Включает в себя govet, errcheck, staticcheck, ineffassign, unused.
  default: standard
  enable:
    # Проверки жизненного цикла сетевых и SQL-ресурсов.
    - bodyclose
    - rowserrcheck
    - sqlclosecheck

    # Ошибки должны корректно оборачиваться через %w и сравниваться через errors.Is/As.
    - errorlint

    # Запрещаем HTTP-запросы без контекста.
    - noctx

    # Проверки качества текста и лишних преобразований.
    - misspell
    - unconvert

  exclusions:
    generated: lax
    rules:
      # В интеграционных тестах допустимы короткоживущие client.Get/Post.
      - path: _test\.go
        linters:
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax

issues:
  # CI должен показать все найденные проблемы, а не только первые 50.
  max-issues-per-linter: 0
  max-same-issues: 0
