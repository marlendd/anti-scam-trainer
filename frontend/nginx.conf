server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Используем системный DNS
    resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

    location /api/ {
        # Динамически собираем URL
        set $backend_upstream "${BACKEND_PROTOCOL}://${BACKEND_HOST}:${BACKEND_PORT}";
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;

        # Поддержка SSL/SNI для публичных доменов *.up.railway.app
        proxy_ssl_server_name on;

        proxy_set_header Host $BACKEND_HOST;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend_health "${BACKEND_PROTOCOL}://${BACKEND_HOST}:${BACKEND_PORT}/health";
        proxy_pass $backend_health;
        proxy_ssl_server_name on;
    }

    location /ready {
        set $backend_ready "${BACKEND_PROTOCOL}://${BACKEND_HOST}:${BACKEND_PORT}/ready";
        proxy_pass $backend_ready;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}