server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 10.100.0.1 127.0.0.11 valid=10s;

    location /api/ {
        # ВАЖНО: Убран слэш в конце переменной/URL!
        set $backend_upstream http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend_health http://${BACKEND_HOST}:${BACKEND_PORT}/health;
        proxy_pass $backend_health;
    }

    location /ready {
        set $backend_ready http://${BACKEND_HOST}:${BACKEND_PORT}/ready;
        proxy_pass $backend_ready;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}