server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Используем внутренний DNS Docker/Railway и публичный fallback
    resolver 127.0.0.11 8.8.8.8 valid=30s;

    location /api/ {
        # Перенос URL в переменную заставляет Nginx резолвить адрес во время запроса, а не при старте
        set $backend_upstream http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend_health http://${BACKEND_HOST}:${BACKEND_PORT}/health;
        proxy_pass $backend_health;
    }

    location /ready {
        set $backend_ready http://${BACKEND_HOST}:${BACKEND_PORT}/ready;
        proxy_pass $backend_ready;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}