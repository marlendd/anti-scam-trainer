server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://antiscam-trainer.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host antiscam-trainer.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass https://antiscam-trainer.up.railway.app/health;
        proxy_ssl_server_name on;
        proxy_set_header Host antiscam-trainer.up.railway.app;
    }

    location /ready {
        proxy_pass https://antiscam-trainer.up.railway.app/ready;
        proxy_ssl_server_name on;
        proxy_set_header Host antiscam-trainer.up.railway.app;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}