name: Check
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v6 

      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Get Tools
        run: make tools

      - name: Lint
        run: make lint
  build:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        version: ['1.25', '1.26']
    steps:
      - name: Checkout 
        uses: actions/checkout@v6 

      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{matrix.version}}
          cache: true 
          cache-dependency-path: backend/go.sum

      - name: Build
        run: |
          cd backend
          go build ./...
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.25', '1.26']
    steps:
      - name: Checkout 
        uses: actions/checkout@v6 

      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{matrix.version}}
          cache: true 

      - name: Run Unit Tests & Generate Coverage
        run: |
          cd backend
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o cover.html

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v5
        if: always() 
        with:
          name: coverage-report-go-${{matrix.version}}
          path: backend/cover.html

      - name: Integration Test
        run: make test-e2e
          
      - name: Dump docker logs on failure
        if: failure()
        run: docker compose logs